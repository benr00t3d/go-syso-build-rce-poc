name: macOS Calculator demo verifier

on:
  push:
    branches: [main, macos-calculator-demo]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.3
          check-latest: true
      - name: Environment
        run: |
          receipts="$RUNNER_TEMP/macos-verifier-receipts"
          mkdir -p "$receipts"
          {
            sw_vers
            uname -m
            go version
            xcrun clang --version
            file arm64-cfg/libLTO.dylib
            codesign --verify --verbose arm64-cfg/libLTO.dylib
          } 2>&1 | tee "$receipts/environment.txt"
      - name: End-to-end verifier
        shell: bash
        run: |
          receipts="$RUNNER_TEMP/macos-verifier-receipts"
          set +e
          KEEP_TMP=1 ./verify-macos.sh 2>&1 | tee "$receipts/result.txt"
          status=${PIPESTATUS[0]}
          set -e
          run=$(sed -n 's/^retained=//p' "$receipts/result.txt" | tail -1)
          if [[ -n "$run" && -d "$run" ]]; then
            cp "$run"/*.stderr "$run"/*.stdout "$run"/*.log "$receipts/" 2>/dev/null || true
          fi
          exit "$status"
      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-verifier-receipts
          path: ${{ runner.temp }}/macos-verifier-receipts
