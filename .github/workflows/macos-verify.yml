name: macOS Calculator demo verifier

on:
  push:
    branches: [main, macos-calculator-demo]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.3
          check-latest: true
      - name: Build Xcode 27 demo library
        run: |
          sdk=$(xcrun --show-sdk-path)
          xcrun clang -isysroot "$sdk" -dynamiclib -fPIC -arch arm64 \
            -Wl,-install_name,@rpath/libLTO.dylib \
            -Wl,-compatibility_version,1.0.0 \
            -Wl,-current_version,5100.3.34 \
            plugin/calculator_demo.c plugin/lto_api_stubs.c \
            -o arm64-cfg/libLTO.dylib
          codesign --force --sign - arm64-cfg/libLTO.dylib
      - name: Environment
        run: |
          receipts="$RUNNER_TEMP/macos-verifier-receipts"
          mkdir -p "$receipts"
          {
            sw_vers
            uname -m
            go version
            xcrun clang --version
            file arm64-cfg/libLTO.dylib
            codesign --verify --verbose arm64-cfg/libLTO.dylib
            shasum -a 256 arm64-cfg/libLTO.dylib
          } 2>&1 | tee "$receipts/environment.txt"
          linker=$(xcrun --find ld)
          clang=$(xcrun --find clang)
          system_lto="$(dirname "$clang")/../lib/libLTO.dylib"
          {
            printf 'linker=%s\n' "$linker"
            otool -L "$linker"
            printf '\nlinker_lto_imports:\n'
            nm -u "$linker" | grep -E '(_lto_|_thinlto_)' | sort -u || true
            printf '\nsystem_lto=%s\n' "$system_lto"
            printf 'system_lto_exports:\n'
            nm -gj "$system_lto" | grep -E '^_(lto_|thinlto_)' | sort -u || true
          } 2>&1 | tee "$receipts/linker-lto-symbols.txt"
      - name: End-to-end verifier
        shell: bash
        run: |
          receipts="$RUNNER_TEMP/macos-verifier-receipts"
          set +e
          KEEP_TMP=1 ./verify-macos.sh 2>&1 | tee "$receipts/result.txt"
          status=${PIPESTATUS[0]}
          set -e
          run=$(sed -n 's/^retained=//p' "$receipts/result.txt" | tail -1)
          if [[ -n "$run" && -d "$run" ]]; then
            cp "$run"/*.stderr "$run"/*.stdout "$run"/*.log "$receipts/" 2>/dev/null || true
          fi
          exit "$status"
      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-verifier-receipts
          path: ${{ runner.temp }}/macos-verifier-receipts
